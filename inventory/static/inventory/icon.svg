<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Swiss, per app.css: no gradients, no rounded corners, no ornament, one red. A carton with a
       taped seam and a red label band, in the app's own #111 / #eceae4 / #ff4d33. Four flat blocks
       because anything finer turns to mud at 16px; the ground is painted so the tile holds on light
       and dark browser chrome alike. -->
  <rect width="32" height="32" fill="#111111"/>
  <rect x="4" y="6" width="24" height="6" fill="#ff4d33"/>
  <rect x="4" y="12" width="24" height="14" fill="#eceae4"/>
  <rect x="15" y="12" width="2" height="14" fill="#111111"/>
</svg>
